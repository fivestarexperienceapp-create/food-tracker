div>\n            <h2 style=\"margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 29px; line-height: 1.08; color: #FFFFFF; letter-spacing: -0.015em;\">{{ recipe.name }}<\u002Fh2>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding: 18px 18px 26px;\">\n          <p style=\"margin: 0 0 18px; font-size: 13.5px; line-height: 1.55; color: #6E6559;\">{{ recipe.tagline }}<\u002Fp>\n\n          <div style=\"display: flex; align-items: center; gap: 14px; background: #FFFFFF; border: 1px solid #E9E1D5; border-radius: 18px; padding: 15px; margin-bottom: 10px;\">\n            <span style=\"width: 58px; height: 58px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: {{ recipe.color }}; flex: none;\">\n              <span style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 19px; color: #24201B; line-height: 1;\">{{ recipe.score }}<\u002Fspan>\n              <span style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.1em; color: rgba(36,32,27,0.6);\">GRADE {{ recipe.grade }}<\u002Fspan>\n            <\u002Fspan>\n            <div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px;\">\n              <sc-for list=\"{{ recipe.breakdown }}\" as=\"b\" hint-placeholder-count=\"3\">\n                <div>\n                  <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px;\">\n                    <span style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: #6E6559;\">{{ b.label }}<\u002Fspan>\n                    <span style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 10px; color: #8A8075;\">{{ b.value }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"height: 4px; border-radius: 999px; background: #EFE9DF; overflow: hidden;\">\n                    <span style=\"display: block; height: 100%; border-radius: 999px; width: {{ b.value }}%; background: {{ b.color }};\"><\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px;\">\n            <sc-for list=\"{{ recipe.macros }}\" as=\"m\" hint-placeholder-count=\"4\">\n              <div style=\"background: #FFFFFF; border: 1px solid #E9E1D5; border-radius: 12px; padding: 10px 8px; text-align: center;\">\n                <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 15px;\">{{ m.value }}<\u002Fdiv>\n                <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 8.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #8A8075; margin-top: 2px;\">{{ m.label }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 8px;\">\n            <div style=\"background: #FFFFFF; border: 1px solid #E9E1D5; border-radius: 14px; padding: 13px;\">\n              <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A8075; margin-bottom: 6px;\">Difficulty<\u002Fdiv>\n              <div style=\"display: flex; align-items: center; gap: 4px; margin-bottom: 5px;\">\n                <sc-for list=\"{{ recipe.diffDots }}\" as=\"d\" hint-placeholder-count=\"5\">\n                  <span style=\"width: 8px; height: 8px; border-radius: 999px; background: {{ d.bg }}; display: block;\"><\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-size: 12px; color: #6E6559;\">{{ recipe.diffLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: #FFFFFF; border: 1px solid #E9E1D5; border-radius: 14px; padding: 13px;\">\n              <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A8075; margin-bottom: 6px;\">Time<\u002Fdiv>\n              <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 15px; margin-bottom: 3px;\">{{ recipe.timeLabel }}<\u002Fdiv>\n              <div style=\"font-size: 12px; color: #6E6559;\">{{ recipe.prep }}m prep · {{ recipe.cook }}m cook<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 22px;\">\n            <div style=\"background: #24201B; border-radius: 14px; padding: 12px;\">\n              <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(247,243,236,0.55); margin-bottom: 5px;\">Food used<\u002Fdiv>\n              <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 17px; color: #F7F3EC;\">{{ recipe.usedLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: #FFFFFF; border: 1px solid #E9E1D5; border-radius: 14px; padding: 12px;\">\n              <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A8075; margin-bottom: 5px;\">Servings<\u002Fdiv>\n              <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 17px;\">{{ recipe.servings }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: #FFFFFF; border: 1px solid #E9E1D5; border-radius: 14px; padding: 12px;\">\n              <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A8075; margin-bottom: 5px;\">Per serving<\u002Fdiv>\n              <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 17px;\">{{ recipe.costLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <h3 style=\"margin: 0 0 4px; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 21px;\">Ingredients<\u002Fh3>\n          <p style=\"margin: 0 0 12px; font-size: 12px; line-height: 1.5; color: #8A8075;\">Prices are what this recipe's share of each ingredient costs. Buying every item from scratch — whole jars, bottles and bunches — runs <strong style=\"color: #24201B; font-weight: 700;\">{{ recipe.packLabel }}<\u002Fstrong>, and the pantry items then cover many more meals. Dots flag processed components and their additives.<\u002Fp>\n          <div style=\"background: #FFFFFF; border: 1px solid #E9E1D5; border-radius: 16px; overflow: hidden; margin-bottom: 22px;\">\n            <sc-for list=\"{{ recipe.ing }}\" as=\"i\" hint-placeholder-count=\"6\">\n              <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #F1EBE1;\">\n                <span style=\"width: 8px; height: 8px; border-radius: 999px; background: {{ i.color }}; display: block; margin-top: 5px; flex: none;\"><\u002Fspan>\n                <div style=\"flex: 1; min-width: 0;\">\n                  <div style=\"display: flex; gap: 8px; align-items: baseline;\">\n                    <span style=\"flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600;\">{{ i.n }}<\u002Fspan>\n                    <span style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 11px; color: #8A8075; flex: none; white-space: nowrap;\">{{ i.q }}<\u002Fspan>\n                    <span style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 11px; flex: none; white-space: nowrap; min-width: 42px; text-align: right;\">{{ i.cLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ i.note }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin-top: 5px; padding: 8px 9px; border-radius: 9px; background: #F7F3EC;\">\n                      <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: {{ i.color2 }}; margin-bottom: 3px;\">{{ i.riskLabel }} · {{ i.a }}<\u002Fdiv>\n                      <div style=\"font-size: 11.5px; line-height: 1.45; color: #6E6559;\">{{ i.note }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <h3 style=\"margin: 0 0 12px; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 21px;\">Method<\u002Fh3>\n          <div style=\"display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px;\">\n            <sc-for list=\"{{ recipe.steps2 }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"display: flex; gap: 12px;\">\n                <span style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 11px; color: var(--mise-accent, #C2542F); flex: none; width: 18px; padding-top: 2px;\">{{ s.n }}<\u002Fspan>\n                <p style=\"margin: 0; font-size: 13.5px; line-height: 1.6;\">{{ s.text }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"border-top: 1px solid #E4DCD0; padding-top: 14px; margin-bottom: 22px;\">\n            <sc-if value=\"{{ recipe.hasSource }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin: 0 0 8px; font-size: 12.5px; line-height: 1.5; color: #6E6559;\">Adapted from <a href=\"{{ recipe.sourceUrl }}\" target=\"_blank\" rel=\"noopener\">{{ recipe.sourceName }}<\u002Fa>.<\u002Fp>\n            <\u002Fsc-if>\n            <p style=\"margin: 0; font-size: 12px; line-height: 1.55; color: #8A8075;\">Method written for Mise, not reprinted from a site \\u2014 so there is nothing to credit. <a href=\"{{ recipe.refUrl }}\" target=\"_blank\" rel=\"noopener\">Compare published versions \\u2192<\u002Fa><\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n            <button sc-camel-on-click=\"{{ logRecipe }}\" style=\"width: 100%; padding: 15px; border-radius: 13px; background: var(--mise-accent, #C2542F); color: #FFFFFF; font-size: 14px; font-weight: 700;\" style-hover=\"background: #D0603A;\">I cooked this — log it<\u002Fbutton>\n            <div style=\"display: flex; gap: 8px;\">\n              <button sc-camel-on-click=\"{{ openDayPicker }}\" style=\"flex: 1; padding: 14px; border-radius: 13px; border: 1px solid #DCD2C4; background: #FFFFFF; font-size: 13px; font-weight: 700;\" style-hover=\"background: #F2E7D9;\">Add to week<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ sourceRecipe }}\" style=\"flex: 1; padding: 14px; border-radius: 13px; border: 1px solid #DCD2C4; background: #FFFFFF; font-size: 13px; font-weight: 700;\" style-hover=\"background: #F2E7D9;\">Find ingredients<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ dayPickerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; inset: 0; z-index: 70; display: flex; justify-content: center; align-items: flex-end;\">\n      <div sc-camel-on-click=\"{{ closeDayPicker }}\" style=\"position: absolute; inset: 0; background: rgba(24, 20, 16, 0.55); animation: miseFade 0.2s ease both;\"><\u002Fdiv>\n      <div style=\"position: relative; width: 100%; max-width: 460px; background: #F7F3EC; border-radius: 24px 24px 0 0; padding: 20px 18px calc(24px + env(safe-area-inset-bottom)); animation: miseSheet 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;\">\n        <h3 style=\"margin: 0 0 4px; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 22px;\">Which day?<\u002Fh3>\n        <p style=\"margin: 0 0 16px; font-size: 12.5px; color: #7A7166;\">{{ pickerName }}<\u002Fp>\n        <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 8px;\">\n          <sc-for list=\"{{ pickerDays }}\" as=\"d\" hint-placeholder-count=\"7\">\n            <button sc-camel-on-click=\"{{ d.add }}\" style=\"padding: 14px 10px; border-radius: 12px; border: 1px solid #DCD2C4; background: #FFFFFF; font-size: 13px; font-weight: 700; text-align: left;\" style-hover=\"background: #F2E7D9; border-color: var(--mise-accent, #C2542F);\">\n              <div>{{ d.name }}<\u002Fdiv>\n              <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: #8A8075; margin-top: 3px;\">{{ d.meta }}<\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeDayPicker }}\" style=\"width: 100%; padding: 13px; border-radius: 12px; font-size: 13px; font-weight: 700; color: #8A8075;\">Cancel<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ settingsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; inset: 0; z-index: 80; display: flex; justify-content: center; align-items: flex-end;\">\n      <div sc-camel-on-click=\"{{ closeSettings }}\" style=\"position: absolute; inset: 0; background: rgba(24, 20, 16, 0.55); animation: miseFade 0.2s ease both;\"><\u002Fdiv>\n      <div style=\"position: relative; width: 100%; max-width: 460px; max-height: 92dvh; overflow-y: auto; background: #F7F3EC; border-radius: 24px 24px 0 0; padding: 22px 18px calc(26px + env(safe-area-inset-bottom)); animation: miseSheet 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;\">\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px;\">\n          <h3 style=\"margin: 0; flex: 1; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 24px;\">Settings<\u002Fh3>\n          <button sc-camel-on-click=\"{{ closeSettings }}\" style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A8075;\">Done<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"background: #FFFFFF; border: 1px solid #E9E1D5; border-radius: 16px; padding: 15px; margin-bottom: 12px;\">\n          <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8075; margin-bottom: 8px;\">Google AI Studio key<\u002Fdiv>\n          <input type=\"password\" value=\"{{ keyDraft }}\" sc-camel-on-change=\"{{ onKeyInput }}\" placeholder=\"AIza...\" autocomplete=\"off\" spellcheck=\"false\" style=\"width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #DCD2C4; background: #F7F3EC; font-family: 'DM Mono', ui-monospace, monospace; font-size: 13px; margin-bottom: 10px;\">\n          <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8075; margin-bottom: 8px;\">Model<\u002Fdiv>\n          <div style=\"display: flex; gap: 6px; margin-bottom: 12px;\">\n            <sc-for list=\"{{ modelOptions }}\" as=\"m\" hint-placeholder-count=\"2\">\n              <button sc-camel-on-click=\"{{ m.pick }}\" style=\"flex: 1; padding: 10px 8px; border-radius: 10px; border: 1px solid {{ m.border }}; background: {{ m.bg }}; color: {{ m.fg }}; font-family: 'DM Mono', ui-monospace, monospace; font-size: 10.5px;\">{{ m.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 8px;\">\n            <button sc-camel-on-click=\"{{ saveKey }}\" style=\"flex: 1; padding: 12px; border-radius: 10px; background: #24201B; color: #F7F3EC; font-size: 13px; font-weight: 700;\">{{ saveKeyLabel }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ clearKey }}\" style=\"flex: none; padding: 12px 14px; border-radius: 10px; border: 1px solid #DCD2C4; font-size: 13px; font-weight: 700; color: #8A8075;\">Clear<\u002Fbutton>\n          <\u002Fdiv>\n          <p style=\"margin: 11px 0 0; font-size: 11.5px; line-height: 1.5; color: #8A8075;\">Stored only in this browser's local storage, sent directly to Google from your device. Get a free key at <a href=\"https://aistudio.google.com/apikey\" target=\"_blank\" rel=\"noopener\">aistudio.google.com/apikey<\u002Fa>.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"background: #FFFFFF; border: 1px solid #E9E1D5; border-radius: 16px; padding: 15px; margin-bottom: 12px;\">\n          <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8075; margin-bottom: 10px;\">Daily calorie target<\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 12px;\">\n            <button sc-camel-on-click=\"{{ targetDown }}\" style=\"width: 40px; height: 40px; border-radius: 10px; border: 1px solid #DCD2C4; font-size: 17px;\">−<\u002Fbutton>\n            <div style=\"flex: 1; text-align: center; font-family: 'DM Mono', ui-monospace, monospace; font-size: 20px;\">{{ target }}<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ targetUp }}\" style=\"width: 40px; height: 40px; border-radius: 10px; border: 1px solid #DCD2C4; font-size: 17px;\">+<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background: #FFFFFF; border: 1px solid #E9E1D5; border-radius: 16px; padding: 15px; margin-bottom: 12px;\">\n          <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8075; margin-bottom: 6px;\">Photography<\u002Fdiv>\n          <p style=\"margin: 0 0 11px; font-size: 12.5px; line-height: 1.5; color: #6E6559;\">{{ photoLine }}<\u002Fp>\n          <div style=\"display: flex; gap: 8px;\">\n            <button sc-camel-on-click=\"{{ refreshPhotos }}\" style=\"flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #DCD2C4; font-size: 12.5px; font-weight: 700;\">{{ photoLabel }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ resetPhotos }}\" style=\"flex: none; padding: 12px 14px; border-radius: 10px; border: 1px solid #DCD2C4; font-size: 12.5px; font-weight: 700; color: #8A8075;\">Reset<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background: #FFFFFF; border: 1px solid #E9E1D5; border-radius: 16px; padding: 15px; margin-bottom: 12px;\">\n          <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8075; margin-bottom: 6px;\">Storage<\u002Fdiv>\n          <p style=\"margin: 0 0 11px; font-size: 12.5px; line-height: 1.5; color: #6E6559;\">{{ storageLine }}<\u002Fp>\n          <div style=\"display: flex; gap: 8px;\">\n            <button sc-camel-on-click=\"{{ exportData }}\" style=\"flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #DCD2C4; font-size: 12.5px; font-weight: 700;\">Export JSON<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ wipeData }}\" style=\"flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #EFC7B7; background: #FBEAE4; color: #96391B; font-size: 12.5px; font-weight: 700;\">Reset app<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #A79C8C; text-align: center;\">Mise · {{ swLine }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; left: 0; right: 0; bottom: 92px; z-index: 90; display: flex; justify-content: center; pointer-events: none; padding: 0 20px;\">\n      <div style=\"max-width: 420px; background: #24201B; color: #F7F3EC; padding: 12px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; box-shadow: 0 8px 24px rgba(36,32,27,0.28); animation: miseUp 0.24s ease both;\">{{ toast }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;calorieTarget&quot;: { &quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 2100, &quot;min&quot;: 1200, &quot;max&quot;: 4500, &quot;step&quot;: 50, &quot;unit&quot;: &quot;cal&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Nutrition&quot; },\n  &quot;scoreEmphasis&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;subtle&quot;, &quot;bold&quot;], &quot;default&quot;: &quot;subtle&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Nutrition&quot; },\n  &quot;showAdditives&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Nutrition&quot; },\n  &quot;currency&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;$&quot;, &quot;£&quot;, &quot;€&quot;], &quot;default&quot;: &quot;$&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Cost&quot; },\n  &quot;accent&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#C2542F&quot;, &quot;options&quot;: [&quot;#C2542F&quot;, &quot;#4A7A4E&quot;, &quot;#3E5C7E&quot;, &quot;#8A5A9E&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Look&quot; }\n}\">\nconst RISK = {\n  none:  { color: '#CFC6B6', color2: '#6E6559', label: 'Whole food', penalty: 0 },\n  low:   { color: '#E8C666', color2: '#8A6A18', label: 'Low risk',      penalty: 8 },\n  moderate: { color: '#E39A4E', color2: '#96591B', label: 'Moderate risk', penalty: 20 },\n  high:  { color: '#D2603E', color2: '#96391B', label: 'High risk',     penalty: 34 }\n};\n\nconst GRADES = [\n  { min: 80, g: 'A', c: '#8FC08A', label: 'Excellent' },\n  { min: 65, g: 'B', c: '#BBCE7E', label: 'Good' },\n  { min: 50, g: 'C', c: '#EBD073', label: 'Middling' },\n  { min: 35, g: 'D', c: '#E8A868', label: 'Poor' },\n  { min: 0,  g: 'E', c: '#DE8069', label: 'Occasional' }\n];\n\nconst DIFF = ['', 'Beginner', 'Easy', 'Some technique', 'Practised', 'Project cook'];\n\nconst RAW = [\n  { id: 'smash-burgers', name: 'Smash Burgers with Sharp Cheddar', cuisine: 'American',\n    tagline: 'Thin patties pressed onto a screaming-hot pan. Twenty minutes, 42 g of protein.',\n    kcal: 720, protein: 42, carbs: 34, fat: 44, fiber: 2, sugar: 8, satfat: 18, sodium: 980,\n    difficulty: 2, prep: 10, cook: 10, servings: 2, cats: ['trending', 'once'],\n    ing: [\n      { n: 'Ground beef, 80/20', q: '1 lb', r: 'none', c: 6.99, p: 6.99 },\n      { n: 'Brioche buns', q: '2', r: 'low', c: 1.5, p: 4.49, a: 'E471 emulsifiers, E282 preservative', note: 'Shelf-stable buns carry dough conditioners and mold inhibitor. Bakery buns are usually flour, butter, egg, yeast.' },\n      { n: 'Sharp cheddar', q: '2 oz', r: 'none', c: 1.2, p: 4.99 },\n      { n: 'Yellow onion', q: '1/2', r: 'none', c: 0.4, p: 0.8 },\n      { n: 'Dill pickles', q: '4 slices', r: 'low', c: 0.6, p: 3.99, a: 'Yellow 5, sodium benzoate', note: 'The dye is cosmetic. Refrigerated pickles usually skip both.' },\n      { n: 'Mayonnaise', q: '2 tbsp', r: 'low', c: 0.25, p: 4.49, a: 'Calcium disodium EDTA', note: 'A chelator that keeps the oil from going rancid. Olive-oil mayo brands often leave it out.' },\n      { n: 'Ketchup', q: '1 tbsp', r: 'low', c: 0.1, p: 3.29, a: 'High-fructose corn syrup', note: 'Sugar-first ketchup. The \"simply\" versions swap in cane sugar at similar cost.' },\n      { n: 'Butter, for the buns', q: '1 tbsp', r: 'none', c: 0.25, p: 4.49 }\n    ],\n    steps: [\n      'Divide the beef into four loose balls. Do not pack them \\u2014 handling makes the patties tight.',\n      'Get a cast-iron pan or flat griddle ripping hot. Butter and toast the cut buns, then set aside.',\n      'Press each ball flat with a stiff spatula and hold for 10 seconds. Salt, then leave alone for 2 minutes until the edge is lace-brown.',\n      'Flip, cheese on immediately, 45 seconds more. Stack two patties per bun with pickle, onion and the sauces.'\n    ] },\n  { id: 'garlic-salmon', name: 'Garlic Butter Salmon & Green Beans', cuisine: 'American',\n    tagline: 'One pan, fifteen minutes, nothing processed in it. The weeknight default.',\n    kcal: 480, protein: 40, carbs: 12, fat: 30, fiber: 4, sugar: 4, satfat: 10, sodium: 420,\n    difficulty: 1, prep: 10, cook: 15, servings: 2, cats: ['trending', 'prep'],\n    ing: [\n      { n: 'Salmon fillets', q: '2 \\u00d7 6 oz', r: 'none', c: 12.99, p: 12.99 },\n      { n: 'Green beans', q: '12 oz', r: 'none', c: 2.99, p: 2.99 },\n      { n: 'Butter', q: '3 tbsp', r: 'none', c: 0.75, p: 4.49 },\n      { n: 'Garlic', q: '4 cloves', r: 'none', c: 0.4, p: 0.79 },\n      { n: 'Lemon', q: '1', r: 'none', c: 0.79, p: 0.79 },\n      { n: 'Olive oil', q: '1 tbsp', r: 'none', c: 0.3, p: 9.99 },\n      { n: 'Parsley', q: '1/4 bunch', r: 'none', c: 0.4, p: 1.29 }\n    ],\n    steps: [\n      'Pat the salmon bone dry and salt it 10 minutes ahead \\u2014 that is the whole trick to a crisp skin.',\n      'Sear skin-down in oil, 6 minutes, undisturbed. The fillet releases on its own when it is ready.',\n      'Flip, add butter and smashed garlic, and spoon the foaming butter over for 90 seconds.',\n      'Blister the green beans in the same pan with the leftover garlic butter. Lemon over everything.'\n    ] },\n  { id: 'sheetpan-chicken', name: 'Sheet-Pan Chicken Thighs, Broccoli & Potatoes', cuisine: 'American',\n    tagline: 'Everything on one tray, nothing from a packet. The best-scoring dinner here.',\n    kcal: 520, protein: 40, carbs: 32, fat: 26, fiber: 6, sugar: 5, satfat: 7, sodium: 620,\n    difficulty: 1, prep: 10, cook: 40, servings: 4, cats: ['prep', 'trending'],\n    ing: [\n      { n: 'Chicken thighs, bone-in skin-on', q: '2 1/2 lb', r: 'none', c: 7.49, p: 7.49 },\n      { n: 'Baby potatoes', q: '1 1/2 lb', r: 'none', c: 3.49, p: 3.49 },\n      { n: 'Broccoli', q: '1 lb', r: 'none', c: 2.49, p: 2.49 },\n      { n: 'Olive oil', q: '3 tbsp', r: 'none', c: 0.8, p: 9.99 },\n      { n: 'Garlic', q: '1 head', r: 'none', c: 0.79, p: 0.79 },\n      { n: 'Lemon', q: '1', r: 'none', c: 0.79, p: 0.79 },\n      { n: 'Paprika, salt, pepper', q: '1 tbsp total', r: 'none', c: 0.4, p: 9.98 }\n    ],\n    steps: [\n      'Halve the potatoes and start them alone at 425\\u00b0F with oil and salt for 15 minutes \\u2014 they need the head start.',\n      'Push them aside, add the thighs skin-up and the whole garlic cloves, and roast 20 minutes.',\n      'Add the broccoli, roast 10 minutes more until the florets char and the thigh skin is glass-crisp.',\n      'Lemon over the tray off the heat. Portion into four boxes; it reheats without going sad.'\n    ] },\n  { id: 'honey-chicken-bowls', name: 'Honey Mustard Chicken Meal-Prep Bowls', cuisine: 'American',\n    tagline: 'Four boxes, 44 g of protein each, done in 45 minutes on a Sunday.',\n    kcal: 480, protein: 44, carbs: 44, fat: 14, fiber: 5, sugar: 12, satfat: 3, sodium: 580,\n    difficulty: 1, prep: 15, cook: 30, servings: 4, cats: ['prep', 'trending'],\n    ing: [\n      { n: 'Chicken thighs, boneless', q: '2 lb', r: 'none', c: 7.99, p: 7.99 },\n      { n: 'Brown rice', q: '1 1/2 cups', r: 'none', c: 1.2, p: 4.49 },\n      { n: 'Broccoli', q: '1 lb', r: 'none', c: 2.49, p: 2.49 },\n      { n: 'Bottled honey mustard', q: '1/3 cup', r: 'moderate', c: 0.9, p: 3.99, a: 'HFCS, E415 xanthan gum, E202', note: 'Two tablespoons of real mustard, honey and vinegar does the same job with nothing added.' },\n      { n: 'Olive oil', q: '2 tbsp', r: 'none', c: 0.55, p: 9.99 },\n      { n: 'Lemon', q: '1', r: 'none', c: 0.79, p: 0.79 },\n      { n: 'Paprika & garlic powder', q: '1 tsp each', r: 'none', c: 0.3, p: 5.98 }\n    ],\n    steps: [\n      'Start the brown rice \\u2014 it takes 40 minutes and everything else beats it.',\n      'Toss the thighs in half the honey mustard, paprika and garlic powder. Roast at 425\\u00b0F for 25 minutes.',\n      'Steam or roast the broccoli until just tender, no further; it has four days of reheating ahead.',\n      'Build four boxes: rice, sliced chicken, broccoli. Remaining sauce and lemon in a lid pot.'\n    ] },\n  { id: 'beef-broccoli', name: 'Beef & Broccoli Stir-Fry', cuisine: 'Chinese-American',\n    tagline: 'Faster than delivery and you control the sugar. Ten minutes in the pan.',\n    kcal: 420, protein: 36, carbs: 26, fat: 20, fiber: 4, sugar: 10, satfat: 6, sodium: 890,\n    difficulty: 2, prep: 20, cook: 10, servings: 4, cats: ['trending'],\n    ing: [\n      { n: 'Flank steak', q: '1 1/4 lb', r: 'none', c: 11.99, p: 11.99 },\n      { n: 'Broccoli crowns', q: '1 1/2 lb', r: 'none', c: 3.49, p: 3.49 },\n      { n: 'Soy sauce', q: '1/3 cup', r: 'low', c: 0.55, p: 3.99, a: 'E202', note: 'Naturally brewed soy lists four ingredients. Skip anything hydrolyzed or colored.' },\n      { n: 'Brown sugar', q: '2 tbsp', r: 'none', c: 0.15, p: 2.99 },\n      { n: 'Cornstarch', q: '1 tbsp', r: 'none', c: 0.1, p: 2.29 },\n      { n: 'Garlic & ginger', q: '4 cloves / 1 tbsp', r: 'none', c: 0.65, p: 1.58 },\n      { n: 'Sesame oil', q: '1 tbsp', r: 'none', c: 0.35, p: 5.99 },\n      { n: 'White rice', q: '1 1/2 cups', r: 'none', c: 1.05, p: 4.99 }\n    ],\n    steps: [\n      'Slice the flank thin against the grain and toss with cornstarch \\u2014 that is what keeps it velvety.',\n      'Blanch the broccoli 90 seconds and drain hard. Wet broccoli steams instead of searing.',\n      'Sear the beef in two batches in a smoking-hot pan, 60 seconds a side, and pull it out.',\n      'Garlic and ginger in for 20 seconds, then soy, sugar and a splash of water. Return everything and toss until glossy.'\n    ] },\n  { id: 'turkey-tacos', name: 'Ground Turkey Taco Bowls', cuisine: 'Tex-Mex',\n    tagline: 'Weeknight bowls the whole house eats. Skip the packet and it scores a grade higher.',\n    kcal: 440, protein: 34, carbs: 38, fat: 18, fiber: 7, sugar: 6, satfat: 5, sodium: 780,\n    difficulty: 1, prep: 15, cook: 15, servings: 4, cats: ['trending', 'prep'],\n    ing: [\n      { n: 'Ground turkey, 93%', q: '1 1/4 lb', r: 'none', c: 6.49, p: 6.49 },\n      { n: 'Taco seasoning packet', q: '1', r: 'moderate', c: 0.99, p: 0.99, a: 'Maltodextrin, silicon dioxide, \"natural flavor\"', note: 'Two teaspoons each of chili powder, cumin and paprika plus salt replaces it exactly, for pennies.' },\n      { n: 'Black beans', q: '1 can (15 oz)', r: 'none', c: 1.29, p: 1.29 },\n      { n: 'White rice', q: '1 1/2 cups', r: 'none', c: 1.05, p: 4.99 },\n      { n: 'Romaine', q: '1 head', r: 'none', c: 2.49, p: 2.49 },\n      { n: 'Shredded Monterey Jack', q: '4 oz', r: 'low', c: 2.2, p: 4.99, a: 'Potato starch, natamycin', note: 'Bagged shreds are coated to stop caking. A block grated yourself melts better anyway.' },\n      { n: 'Salsa', q: '1 cup', r: 'none', c: 1.6, p: 3.99 },\n      { n: 'Sour cream', q: '1/4 cup', r: 'none', c: 0.6, p: 2.99 }\n    ],\n    steps: [\n      'Brown the turkey hard and do not stir for the first three minutes \\u2014 lean meat needs the crust for flavor.',\n      'Add the seasoning and a half cup of water, then simmer until it tightens back up.',\n      'Warm the drained beans through with a pinch of cumin.',\n      'Build bowls over rice with shredded romaine, cheese, salsa and a spoon of sour cream.'\n    ] },\n  { id: 'burrito-bowls', name: 'Chicken Burrito Bowls', cuisine: 'Tex-Mex',\n    tagline: 'Cheaper than the chain, and you can taste the lime. Four boxes at once.',\n    kcal: 560, protein: 42, carbs: 56, fat: 18, fiber: 9, sugar: 6, satfat: 5, sodium: 820,\n    difficulty: 2, prep: 20, cook: 25, servings: 4, cats: ['prep', 'trending'],\n    ing: [\n      { n: 'Chicken thighs, boneless', q: '1 3/4 lb', r: 'none', c: 6.99, p: 6.99 },\n      { n: 'White rice', q: '1 1/2 cups', r: 'none', c: 1.05, p: 4.99 },\n      { n: 'Black beans', q: '2 cans (15 oz)', r: 'none', c: 2.58, p: 2.58 },\n      { n: 'Frozen corn', q: '1 cup', r: 'none', c: 0.6, p: 2.49 },\n      { n: 'Shredded cheese', q: '4 oz', r: 'low', c: 2.2, p: 4.99, a: 'Potato starch, natamycin', note: 'Same anti-caking coating as any bagged shred. Grate a block if it bothers you.' },\n      { n: 'Salsa', q: '1 cup', r: 'none', c: 1.6, p: 3.99 },\n      { n: 'Limes', q: '2', r: 'none', c: 0.7, p: 0.7 },\n      { n: 'Cilantro', q: '1 bunch', r: 'none', c: 1.29, p: 1.29 },\n      { n: 'Cumin & chili powder', q: '2 tsp each', r: 'none', c: 0.4, p: 6.98 }\n    ],\n    steps: [\n      'Rub the thighs with cumin, chili powder and salt. Sear in a hot pan, 6 minutes a side, then rest and chop.',\n      'Cook the rice, then fold through lime juice and half the cilantro off the heat.',\n      'Warm the beans with their own liquid and a pinch of cumin so they do not dry out in the box.',\n      'Char the corn in the chicken pan for two minutes. Build the bowls and keep the salsa separate until you eat.'\n    ] },\n  { id: 'chicken-parm', name: 'Baked Chicken Parmesan', cuisine: 'Italian-American',\n    tagline: 'Baked, not fried, so it stays a weeknight. Forty-eight grams of protein a plate.',\n    kcal: 620, protein: 48, carbs: 42, fat: 26, fiber: 4, sugar: 10, satfat: 11, sodium: 1120,\n    difficulty: 3, prep: 20, cook: 25, servings: 4, cats: ['trending', 'once'],\n    ing: [\n      { n: 'Chicken breasts', q: '2 lb', r: 'none', c: 9.99, p: 9.99 },\n      { n: 'Italian breadcrumbs', q: '1 cup', r: 'moderate', c: 1, p: 2.49, a: 'E282 calcium propionate, \"natural flavors\"', note: 'Blitz stale bread with dried oregano instead and the dish loses nothing.' },\n      { n: 'Marinara', q: '1 jar (24 oz)', r: 'low', c: 2.99, p: 2.99, a: 'Citric acid', note: 'Acidity regulator for shelf life. A jar listing tomatoes, oil, garlic, basil and salt is the one to buy.' },\n      { n: 'Mozzarella', q: '8 oz', r: 'none', c: 3.99, p: 3.99 },\n      { n: 'Parmesan', q: '2 oz', r: 'none', c: 2.5, p: 7.99 },\n      { n: 'Eggs', q: '2', r: 'none', c: 0.6, p: 4.29 },\n      { n: 'Olive oil', q: '2 tbsp', r: 'none', c: 0.55, p: 9.99 },\n      { n: 'Spaghetti', q: '8 oz', r: 'none', c: 1.1, p: 2.49 }\n    ],\n    steps: [\n      'Butterfly the breasts and pound them to an even half inch. Uneven cutlets are why chicken parm goes dry.',\n      'Egg, then breadcrumbs mixed with half the parmesan. Press the coating on properly.',\n      'Bake on an oiled rack at 425\\u00b0F for 18 minutes \\u2014 the rack is what keeps the underside crisp.',\n      'Sauce and mozzarella on top, back in for 7 minutes until blistered. Rest 5 minutes before cutting.'\n    ] },\n  { id: 'steak-potatoes', name: 'Cast-Iron Ribeye & Crispy Potatoes', cuisine: 'American',\n    tagline: 'The dish to learn properly: dry surface, hot iron, butter at the end, rest it.',\n    kcal: 780, protein: 46, carbs: 34, fat: 52, fiber: 4, sugar: 3, satfat: 20, sodium: 620,\n    difficulty: 3, prep: 15, cook: 25, servings: 2, cats: ['once', 'trending'],\n    ing: [\n      { n: 'Ribeye steaks', q: '2 \\u00d7 10 oz', r: 'none', c: 21.99, p: 21.99 },\n      { n: 'Yukon gold potatoes', q: '1 1/2 lb', r: 'none', c: 2.49, p: 2.49 },\n      { n: 'Butter', q: '2 tbsp', r: 'none', c: 0.5, p: 4.49 },\n      { n: 'Garlic', q: '4 cloves', r: 'none', c: 0.4, p: 0.79 },\n      { n: 'Fresh thyme', q: '4 sprigs', r: 'none', c: 1.99, p: 1.99 },\n      { n: 'Neutral oil', q: '2 tbsp', r: 'none', c: 0.2, p: 4.99 },\n      { n: 'Kosher salt & black pepper', q: 'to season', r: 'none', c: 0.15, p: 4.49 }\n    ],\n    steps: [\n      'Salt the steaks and leave them uncovered in the fridge for an hour. A dry surface browns; a wet one steams.',\n      'Parboil the halved potatoes 8 minutes, drain, then rough them up in the colander for edges to crisp.',\n      'Roast the potatoes in oil at 425\\u00b0F for 30 minutes while the pan heats until it just smokes.',\n      'Sear the steaks 3 minutes a side, then butter, garlic and thyme, basting 60 seconds.',\n      'Rest 8 minutes on a board. Slice against the grain and spoon the pan butter over.'\n    ] },\n  { id: 'meatloaf', name: 'Glazed Meatloaf', cuisine: 'American',\n    tagline: 'Six portions, sandwiches tomorrow. The cheapest protein per dollar in the app.',\n    kcal: 480, protein: 34, carbs: 22, fat: 28, fiber: 2, sugar: 12, satfat: 11, sodium: 860,\n    difficulty: 2, prep: 15, cook: 60, servings: 6, cats: ['once', 'prep'],\n    ing: [\n      { n: 'Ground beef, 85/15', q: '2 lb', r: 'none', c: 11.99, p: 11.99 },\n      { n: 'Panko', q: '1 cup', r: 'none', c: 0.9, p: 3.49 },\n      { n: 'Eggs', q: '2', r: 'none', c: 0.6, p: 4.29 },\n      { n: 'Yellow onion', q: '1', r: 'none', c: 0.8, p: 0.8 },\n      { n: 'Ketchup', q: '1/2 cup', r: 'low', c: 0.55, p: 3.29, a: 'High-fructose corn syrup', note: 'It is the glaze, so it matters here. Cane-sugar ketchup browns the same.' },\n      { n: 'Worcestershire', q: '1 tbsp', r: 'low', c: 0.15, p: 4.29, a: 'E150 caramel color', note: 'Colorant only \\u2014 no flavor contribution.' },\n      { n: 'Brown sugar', q: '2 tbsp', r: 'none', c: 0.15, p: 2.99 },\n      { n: 'Whole milk', q: '1/4 cup', r: 'none', c: 0.2, p: 4.29 }\n    ],\n    steps: [\n      'Soak the panko in the milk for five minutes. That paste is the difference between tender and bouncy.',\n      'Sweat the diced onion soft and let it cool before it goes near the meat.',\n      'Mix everything with your hands until just combined, then shape free-form on a sheet pan \\u2014 no loaf tin, so the sides brown.',\n      'Bake at 375\\u00b0F for 40 minutes, glaze with the ketchup and brown sugar, then 20 minutes more. Rest 10.'\n    ] },\n  { id: 'pot-roast', name: 'Sunday Pot Roast', cuisine: 'American',\n    tagline: 'Four hours of doing nothing. Feeds six and reheats better than it started.',\n    kcal: 560, protein: 44, carbs: 28, fat: 30, fiber: 4, sugar: 8, satfat: 12, sodium: 760,\n    difficulty: 3, prep: 25, cook: 210, servings: 6, cats: ['once'],\n    ing: [\n      { n: 'Chuck roast', q: '3 1/2 lb', r: 'none', c: 17.99, p: 17.99 },\n      { n: 'Carrots', q: '1 lb', r: 'none', c: 1.99, p: 1.99 },\n      { n: 'Yukon potatoes', q: '2 lb', r: 'none', c: 3.29, p: 3.29 },\n      { n: 'Yellow onions', q: '2', r: 'none', c: 1.6, p: 1.6 },\n      { n: 'Beef broth', q: '4 cups', r: 'low', c: 2.49, p: 2.49, a: 'Yeast extract, \"natural flavor\"', note: 'Carton broth is mostly salt and yeast extract. Low-sodium versions let you season it yourself.' },\n      { n: 'Tomato paste', q: '2 tbsp', r: 'none', c: 0.3, p: 1.29 },\n      { n: 'Red wine', q: '1 cup', r: 'none', c: 3, p: 9.99 },\n      { n: 'Fresh thyme & bay', q: '1 bundle', r: 'none', c: 1.99, p: 1.99 }\n    ],\n    steps: [\n      'Salt the roast an hour ahead. Dry it, then brown every face hard in a Dutch oven \\u2014 this is 80% of the flavor.',\n      'Onions in the fat until deeply colored, then tomato paste for two minutes, then deglaze with the wine.',\n      'Broth to halfway up the meat, lid on, 325\\u00b0F for 2.5 hours.',\n      'Add carrots and potatoes, another hour until a fork twists out with no resistance.',\n      'Skim the fat, reduce the liquid on the stove until it coats a spoon, and shred the meat back into it.'\n    ] },\n  { id: 'fried-chicken', name: 'Buttermilk Fried Chicken', cuisine: 'American',\n    tagline: 'Once a season, done properly. Brine overnight; the frying is the easy part.',\n    kcal: 690, protein: 42, carbs: 38, fat: 38, fiber: 1, sugar: 4, satfat: 9, sodium: 1080,\n    difficulty: 4, prep: 30, cook: 30, servings: 4, cats: ['once'],\n    ing: [\n      { n: 'Chicken, jointed', q: '3 1/2 lb', r: 'none', c: 8.99, p: 8.99 },\n      { n: 'Buttermilk', q: '2 cups', r: 'none', c: 1.99, p: 2.99 },\n      { n: 'All-purpose flour', q: '2 cups', r: 'none', c: 0.6, p: 3.49 },\n      { n: 'Peanut or canola oil', q: '6 cups', r: 'none', c: 5.99, p: 5.99 },\n      { n: 'Paprika, garlic powder, cayenne', q: '1 tbsp each', r: 'none', c: 0.6, p: 8.97 },\n      { n: 'Kosher salt', q: '2 tbsp', r: 'none', c: 0.15, p: 4.49 },\n      { n: 'Black pepper', q: '1 tbsp', r: 'none', c: 0.2, p: 4.49 }\n    ],\n    steps: [\n      'Brine the chicken in buttermilk with a tablespoon of salt, overnight. Non-negotiable for juicy dark meat.',\n      'Season the flour heavily \\u2014 it is the only seasoning the crust gets. Splash in buttermilk and rub it to shaggy clumps.',\n      'Dredge, then rest the pieces on a rack 15 minutes so the coating hydrates and stops falling off.',\n      'Fry at 325\\u00b0F, dark meat first, 12\\u201314 minutes, in batches that never crowd the pot.',\n      'Rack, never paper towel. Salt the second it comes out.'\n    ] },\n  { id: 'mac-chicken', name: 'Baked Mac & Cheese with Chicken', cuisine: 'American',\n    tagline: 'A real bechamel, six portions. The processed-cheese shortcut is what costs it points.',\n    kcal: 640, protein: 38, carbs: 52, fat: 30, fiber: 2, sugar: 7, satfat: 16, sodium: 940,\n    difficulty: 2, prep: 20, cook: 30, servings: 6, cats: ['once', 'prep'],\n    ing: [\n      { n: 'Elbow macaroni', q: '1 lb', r: 'none', c: 1.49, p: 1.49 },\n      { n: 'Sharp cheddar', q: '12 oz', r: 'none', c: 5.99, p: 5.99 },\n      { n: 'Whole milk', q: '3 cups', r: 'none', c: 0.9, p: 4.29 },\n      { n: 'Butter', q: '4 tbsp', r: 'none', c: 1, p: 4.49 },\n      { n: 'All-purpose flour', q: '1/4 cup', r: 'none', c: 0.15, p: 3.49 },\n      { n: 'Rotisserie chicken, shredded', q: '1 lb', r: 'moderate', c: 6.99, p: 6.99, a: 'Sodium phosphates, carrageenan', note: 'Supermarket birds are injected ;\n  const nutrition = Math.round(clamp(100 - neg * 3 + pos * 1.2, 0, 100));\n  const penalty = r.ing.reduce(function (s, i) { return s + RISK[i.r].penalty; }, 0);\n  const additives = Math.round(clamp(100 - penalty, 0, 100));\n  const whole = Math.round(r.ing.filter(function (i) { return i.r === 'none'; }).length / r.ing.length * 100);\n  const score = Math.round(nutrition * 0.65 + additives * 0.25 + whole * 0.1);\n  return { score: score, nutrition: nutrition, additives: additives, whole: whole };\n}\n\nfunction money(v, cur) { return cur + v.toFixed(2); }\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const stored = this.load();\n    this.recipes = RAW.map(function (r) {\n      const s = scoreRecipe(r);\n      const g = gradeOf(s.score);\n      /* Cost is built from the ingredient list, not hand-set: `c` is what the\n         recipe's share of an ingredient costs, `p` is the smallest pack you\n         can actually buy. Per serving comes off the used total. */\n      const used = r.ing.reduce(function (a, i) { return a + (i.c || 0); }, 0);\n      const pack = r.ing.reduce(function (a, i) { return a + (i.p || 0); }, 0);\n      return Object.assign({}, r, {\n        usedCost: used, packCost: pack, cost: used / r.servings,\n        score: s.score, parts: s, grade: g.g, color: g.c, gradeLabel: g.label,\n        time: r.prep + r.cook, diffLabel: DIFF[r.difficulty] + ' · ' + r.difficulty + '/5',\n        slotId: 'mise-' + r.id, slotIdB: 'mise-b-' + r.id, slotIdC: 'mise-c-' + r.id, slotHint: r.name.toLowerCase()\n      });\n    });\n    this.state = Object.assign({\n      screen: 'scan', filter: 'all', day: Math.max(0, (new Date().getDay() + 6) % 7),\n      recipeId: null, dayPickerFor: null, settingsOpen: false,\n      apiKey: '', keyDraft: '', model: 'gemini-3.6-flash', target: 2100,\n      entries: [], plan: {}, bought: {}, coords: null,\n      photoOverrides: {}, photoBusy: false, seed: 0,\n      scanStage: 'idle', scanImg: null  (e) => {\n    const f = e.target.files && e.target.files[0];\n    e.target.value = '';\n    if (!f) return;\n    const reader = new FileReader();\n    reader.onload = () => this.shrink(String(reader.result));\n    reader.readAsDataURL(f);\n  };\n\n  shrink(dataUrl) {\n    const img = new Image();\n    img.onload = () => {\n      const max = 1024;\n      const k = Math.min(1, max / Math.max(img.width, img.height));\n      const c = document.createElement('canvas');\n      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);\n      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);\n      const out = c.toDataURL('image/jpeg', 0.82);\n      this.setState({ scanImg: out, scanStage: 'busy', scanResult: null, scanError: null }, () => this.analyze(out));\n    };\n    img.onerror = () => this.setState({ scanStage: 'error', scanError: 'That file could not be read as an image.' });\n    img.src = dataUrl;\n  }\n\n  async analyze(dataUrl) {\n    const steps = ['Reading the plate', 'Identifying components', 'Estimating the portion', 'Scoring nutrition & additives'];\n    let i = 0;\n    this.setState({ scanStatus: steps[0] });\n    this._scanTick = setInterval(() => {\n      i = Math.min(i + 1, steps.length - 1);\n      this.setState({ scanStatus: steps[i] });\n    }, 1100);\n\n    const schema = {\n      type: 'object',\n      properties: {\n        dishName: { type: 'string' }, cuisine: { type: 'string' }, confidence: { type: 'number' },\n        portionEstimate: { type: 'string' }, kcal: { type: 'number' }, protein: { type: 'number' },\n        carbs: { type: 'number' }, fat: { type: 'number' }, fiber: { type: 'number' }, sodium: { type: 'number' },\n        healthScore: { type: 'number' }, grade: { type: 'string' }, costEstimate: { type: 'number' },\n        verdict: { type: 'string' }, betterSwap: { type: 'string' },\n        ingredients: {\n          type: 'array', items: {\n            type: 'object',\n            properties: { name: { type: 'string' }, risk: { type: 'string' }, note: { type: 'string' } },\n            required: ['name', 'risk', 'note']\n          }\n        }\n      },\n      required: ['dishName', 'confidence', 'portionEstimate', 'kcal', 'protein', 'carbs', 'fat', 'healthScore', 'grade', 'verdict', 'betterSwap', 'ingredients']\n    };\n    const prompt = 'You are the food-analysis engine for a cooking and nutrition app. Analyze this photograph of a meal.\\n' +\n      'Rules: identify the dish specifically (not \"a plate of food\"). Estimate the portion actually visible in US customary units — ounces, pounds or cups, never grams. ' +\n      'Give per-portion nutrition for what is shown, in US label units — energy as Calories, macros in grams, sodium in milligrams. healthScore is 0-100 weighing nutrition density 65%, processed/additive load 25%, whole-food share 10%. Be strict: a rich restaurant-style main with high saturated fat or sodium belongs in the 30s-40s, a whole-food vegetable and pulse dish in the 80s-90s; ' +\n      'grade is A (80+), B (65+), C (50+), D (35+) or E. For each visible or strongly implied component set risk to exactly one of ' +\n      '\"none\", \"low\", \"moderate\", \"high\" — \"none\" for whole foods, higher for processed items, naming the likely additive in note (one short sentence). ' +\n      'costEstimate is the approximate cost of the portion in US dollars. verdict is one honest sentence. betterSwap is one specific, actionable improvement. ' +\n      'If the image is not food, set dishName to \"Not food\" and confidence to 0.';\n\n    try {\n      const out = await this.gemini([\n        { text: prompt },\n        { inlineData: { mimeType: 'image/jpeg', data: dataUrl.split(',')[1] } }\n      ], schema, 0.25);\n      clearInterval(this._scanTick);\n      this.setState({ scanStage: 'done', scanResult: this.shapeScan(out, 'Gemini vision') });\n    } catch (err) {\n      clearInterval(this._scanTick);\n      this.setState({\n        scanStage: 'error',\
