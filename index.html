document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"{{ r.open }}\" style=\"flex: none; width: 208px; scroll-snap-align: start; text-align: left; background: #FFFFFF; border: 1px solid #E9E1D5; border-radius: 18px; overflow: hidden; box-shadow: 0 2px 8px rgba(36,32,27,0.05); display: block;\" style-hover=\"box-shadow: 0 8px 20px rgba(36,32,27,0.1);\">\n              <div style=\"position: relative; height: 132px; background: #EFE9DF;\">\n                <sc-if value=\"{{ r.photo }}\" hint-placeholder-val=\"{{ false }}\">\n                  <image-slot id=\"{{ r.slotId }}\" shape=\"rect\" fit=\"cover\" src=\"{{ r.photo }}\" credit=\"{{ r.credit }}\" credit-href=\"{{ r.creditHref }}\" placeholder=\"{{ r.slotHint }}\"><\u002Fimage-slot>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ showCardScore }}\" hint-placeholder-val=\"{{ true }}\">\n                  <span style=\"position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', ui-monospace, monospace; font-size: 12px; color: #24201B; background: {{ r.color }}; box-shadow: 0 2px 6px rgba(36,32,27,0.2); pointer-events: none;\">{{ r.grade }}<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"padding: 11px 12px 13px;\">\n                <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8075; margin-bottom: 4px;\">{{ r.cuisine }}<\u002Fdiv>\n                <div style=\"font-size: 14px; font-weight: 700; line-height: 1.25; letter-spacing: -0.01em; margin-bottom: 8px; min-height: 35px;\">{{ r.name }}<\u002Fdiv>\n                <div style=\"display: flex; align-items: center; gap: 7px; font-family: 'DM Mono', ui-monospace, monospace; font-size: 10px; color: #6E6559;\">\n                  <span style=\"flex: none; white-space: nowrap;\">{{ r.timeLabel }}<\u002Fspan>\n                  <span style=\"width: 3px; height: 3px; border-radius: 999px; background: #C9BFAF; display: block; flex: none;\"><\u002Fspan>\n                  <span style=\"flex: none; white-space: nowrap;\">{{ r.kcal }} cal<\u002Fspan>\n                  <span style=\"width: 3px; height: 3px; border-radius: 999px; background: #C9BFAF; display: block; flex: none;\"><\u002Fspan>\n                  <span style=\"flex: none; white-space: nowrap;\">{{ r.protein }}g P<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"margin: 0 0 28px;\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 6px;\">\n          <h2 style=\"margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 23px; letter-spacing: -0.01em;\">Cook once in your life<\u002Fh2>\n          <button sc-camel-on-click=\"{{ shuffleFeed }}\" style=\"flex: none; padding: 7px 12px; border-radius: 999px; border: 1px solid #DCD2C4; background: #FFFFFF; font-family: 'DM Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap;\" style-hover=\"background: #F2E7D9; border-color: var(--mise-accent, #C2542F);\">{{ shuffleLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"margin: 0 0 14px; font-size: 12.5px; line-height: 1.5; color: #7A7166; max-width: 34ch;\">The plates worth learning properly — technique you keep. Showing {{ classicCount }}; shuffle for the rest.<\u002Fp>\n        <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;\">\n          <sc-for list=\"{{ classics }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ r.open }}\" style=\"display: block; width: 100%; text-align: left; background: #FFFFFF; border: 1px solid #E9E1D5; border-radius: 16px; overflow: hidden; padding: 0;             <button sc-camel-on-click=\"{{ m.open }}\" style=\"flex: 1; min-width: 0; text-align: left;\">\n              <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A8075; margin-bottom: 3px;\">{{ m.slot }}<\u002Fdiv>\n              <div style=\"font-size: 14px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 4px;\">{{ m.name }}<\u002Fdiv>\n              <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 10px; color: #6E6559;\">{{ m.kcal }} cal · {{ m.costLabel }} · {{ m.timeLabel }}<\u002Fdiv>\n            <\u002Fbutton>\n            <button sc-camel-on-click=\"{{ m.remove }}\" aria-label=\"Remove\" style=\"width: 30px; height: 30px; border-radius: 999px; border: 1px solid #E9E1D5; color: #A79C8C; flex: none; font-size: 15px; line-height: 1;\" style-hover=\"border-color: var(--mise-accent, #C2542F); color: var(--mise-accent, #C2542F);\">×<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ dayEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border: 1px dashed #D8CBB8; border-radius: 16px; padding: 26px 18px; text-align: center; background: rgba(255,255,255,0.5);\">\n            <p style=\"margin: 0 0 12px; font-size: 13px; line-height: 1.5; color: #7A7166;\">Nothing planned for {{ dayLabel }} yet.<\u002Fp>\n            <button sc-camel-on-click=\"{{ autoFillDay }}\" style=\"padding: 10px 16px; border-radius: 999px; background: #24201B; color: #F7F3EC; font-size: 12.5px; font-weight: 700;\">Fill it for me<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 6px;\">\n        <h2 style=\"margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 23px;\">Shopping list<\u002Fh2>\n        <span style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8075;\">{{ listMeta }}<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin: 0 0 14px; font-size: 12.5px; line-height: 1.5; color: #7A7166;\">Rolled up from every dish in the week — {{ grocery.meals }} dishes, {{ grocery.servings }} servings. Tap to tick off.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 12px;\">\n        <div style=\"background: #24201B; border-radius: 14px; padding: 12px;\">\n          <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(247,243,236,0.55); margin-bottom: 5px;\">Full shop<\u002Fdiv>\n          <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 17px; color: #F7F3EC;\">{{ grocery.packLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E9E1D5; border-radius: 14px; padding: 12px;\">\n          <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A8075; margin-bottom: 5px;\">Food used<\u002Fdiv>\n          <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 17px;\">{{ grocery.usedLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #E9E1D5; border-radius: 14px; padding: 12px;\">\n          <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A8075; margin-bottom: 5px;\">Per serving<\u002Fdiv>\n          <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 17px;\">{{ grocery.perServingLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid #E9E1D5; border-radius: 16px; overflow: hidden;\">\n        <sc-for list=\"{{ shopping }}\" as=\"s\" hint-placeholder-count=\"0\">\n          <button sc-camel-on-click=\"{{ s.toggle }}\" style=\"display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 12px 14px; border-bottom: 1px solid #F1EBE1;\">\n            <span style=\"width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid {{ s.boxBorder }}; background: {{ s.boxBg }}; flex: none;\"><\u002Fspan>\n            <span style=\"flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600; color: {{ s.fg }}; text-decoration: {{ s.strike }};\">{{ s.name }}<\u002Fspan>\n            <span style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 11px; color: #8A8075; flex: none; white-space: nowrap;\">{{ s.qty }}<\u002Fspan>\n            <span style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 11px; flex: none; white-space: nowrap; min-width: 44px; text-align: right; color: {{ s.fg }};\">{{ s.packLabel }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ listEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding: 22px 16px; text-align: center; font-size: 13px; color: #8A8075;\">Plan a dish and the list writes itself.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 8px; margin: 12px 0 0;\">\n        <div style=\"display: flex; gap: 8px;\">\n          <button sc-camel-on-click=\"{{ copyList }}\" style=\"flex: 1; padding: 13px; border-radius: 12px; border: 1px solid #DCD2C4; background: #FFFFFF; font-size: 13px; font-weight: 700;\" style-hover=\"background: #F2E7D9;\">{{ shareLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ downloadList }}\" style=\"flex: 1; padding: 13px; border-radius: 12px; border: 1px solid #DCD2C4; background: #FFFFFF; font-size: 13px; font-weight: 700;\" style-hover=\"background: #F2E7D9;\">Download .txt<\u002Fbutton>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ goSource }}\" style=\"width: 100%; padding: 13px; border-radius: 12px; background: #24201B; color: #F7F3EC; font-size: 13px; font-weight: 700;\">Where to buy<\u002Fbutton>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isScan }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"AI scan\" style=\"animation: miseFade 0.28s ease both;\">\n\n      <sc-if value=\"{{ noKey }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; gap: 11px; align-items: flex-start; background: #F2E7D9; border: 1px solid #E4D5BE; border-radius: 14px; padding: 13px; margin: 0 0 18px;\">\n          <span style=\"width: 7px; height: 7px; border-radius: 999px; background: var(--mise-accent, #C2542F); display: block; margin-top: 6px; flex: none;\"><\u002Fspan>\n          <div style=\"flex: 1; min-width: 0;\">\n            <div style=\"font-size: 13px; font-weight: 700; margin-bottom: 3px;\">Connect Gemini to scan<\u002Fdiv>\n            <p style=\"margin: 0 0 9px; font-size: 12.5px; line-height: 1.5; color: #6E6559;\">Vision analysis runs on your own Google AI Studio key. Free tier is plenty — it stays on this device and talks to Google directly.<\u002Fp>\n            <button sc-camel-on-click=\"{{ openSettings }}\" style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mise-accent, #C2542F);\">Add key →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ scanIdle }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <div style=\"border: 1px dashed #C9BFAF; border-radius: 22px; background: #FFFFFF; padding: 34px 22px; text-align: center; margin: 0 0 14px;\">\n            <span style=\"width: 62px; height: 62px; border-radius: 999px; background: #24201B; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px;\">\n              <span style=\"width: 26px; height: 26px; border-radius: 999px; border: 3px solid #F7F3EC; display: block;\"><\u002Fspan>\n            <\u002Fspan>\n            <h2 style=\"margin: 0 0 8px; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 25px; letter-spacing: -0.01em;\">Photograph the plate<\u002Fh2>\n            <p style=\"margin: 0 auto 20px; font-size: 13px; line-height: 1.55; color: #7A7166; max-width: 30ch;\">Gemini identifies the dish, estimates the portion, breaks down macros and flags anything processed.<\u002Fp>\n            <sc-if value=\"{{ hasKey }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n                <label style=\"display: block; padding: 14px; border-radius: 12px; background: var(--mise-accent, #C2542F); color: #FFFFFF; font-size: 13.5px; font-weight: 700; cursor: pointer;\">\n                  Take a photo\n                  <input type=\"file\" accept=\"image/*\" capture=\"environment\" sc-camel-on-change=\"{{ onPickFile }}\" style=\"display: none;\">\n                <\u002Flabel>\n                <label style=\"display: block; padding: 13px; border-radius: 12px; border: 1px solid #DCD2C4; font-size: 13px; font-weight: 700; cursor: pointer;\">\n                  Upload from library\n                  <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ onPickFile }}\" style=\"display: none;\">\n                <\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noKey }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ openSettings }}\" style=\"width: 100%; padding: 14px; border-radius: 12px; background: #24201B; color: #F7F3EC; font-size: 13.5px; font-weight: 700;\">Add your API key to scan<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 8px; font-family: 'DM Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.06em; color: #8A8075; padding: 0 4px;\">\n            <span>Photos stay on device<\u002Fspan>\n            <span>·<\u002Fspan>\n            <span>only sent to Google when you scan<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ scanBusy }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"text-align: center; padding: 8px 0 0;\">\n          <div style=\"position: relative; height: 240px; border-radius: 20px; overflow: hidden; background: #24201B; margin-bottom: 20px;\">\n            <sc-if value=\"{{ scanImg }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"position: absolute; inset: 0; background-image: {{ scanImgCss }}; background-size: cover; background-position: center; opacity: 0.55;\"><\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;\">\n              <span style=\"width: 44px; height: 44px; border-radius: 999px; border: 3px solid rgba(247,243,236,0.25); border-top-color: #F7F3EC; display: block; animation: miseSpin 0.9s linear infinite;\"><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #6E6559; animation: misePulse 1.6s ease-in-out infinite;\">{{ scanStatus }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ scanError }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background: #FBEAE4; border: 1px solid #EFC7B7; border-radius: 14px; padding: 14px; margin: 0 0 14px;\">\n          <div style=\"font-size: 13px; font-weight: 700; margin-bottom: 4px;\">Analysis failed<\u002Fdiv>\n          <p style=\"margin: 0 0 10px; font-size: 12.5px; line-height: 1.5; color: #6E6559; word-break: break-word;\">{{ scanError }}<\u002Fp>\n          <button sc-camel-on-click=\"{{ resetScan }}\" style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mise-accent, #C2542F);\">Try again →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ scanResult }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"animation: miseUp 0.34s ease both;\">\n          <div style=\"position: relative; height: 190px; border-radius: 20px; overflow: hidden; margin-bottom: 14px; background: #24201B;\">\n            <sc-if value=\"{{ scanImg }}\" hint-placeholder-val=\"{{ false }}\">\n              <div role=\"img\" aria-label=\"Analysed dish\" style=\"position: absolute; inset: 0; background-image: {{ scanImgCss }}; background-size: cover; background-position: center;\"><\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"position: absolute; inset: 0; background: linear-gradient(180deg, rgba(36,32,27,0) 40%, rgba(36,32,27,0.88) 100%);\"><\u002Fdiv>\n            <div style=\"position: absolute; left: 14px; right: 14px; bottom: 12px;\">\n              <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(247,243,236,0.6); margin-bottom: 4px;\">{{ scanResult.sourceLabel }} · {{ scanResult.confidenceLabel }}<\u002Fdiv>\n              <h2 style=\"margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 26px; line-height: 1.1; color: #FFFFFF;\">{{ scanResult.dishName }}<\u002Fh2>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; align-items: center; gap: 14px; background: #FFFFFF; border: 1px solid #E9E1D5; border-radius: 18px; padding: 15px; margin-bottom: 10px;\">\n            <span style=\"width: 58px; height: 58px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: {{ scanResult.color }}; flex: none;\">\n              <span style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 19px; color: #24201B; line-height: 1;\">{{ scanResult.healthScore }}<\u002Fspan>\n              <span style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.1em; color: rgba(36,32,27,0.6);\">GRADE {{ scanResult.grade }}<\u002Fspan>\n            <\u002Fspan>\n            <div style=\"flex: 1; min-width: 0;\">\n              <p style=\"margin: 0 0 4px; font-size: 13px; line-height: 1.45; font-weight: 600;\">{{ scanResult.verdict }}<\u002Fp>\n              <p style=\"margin: 0; font-size: 12px; line-height: 1.45; color: #7A7166;\">{{ scanResult.portionEstimate }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px;\">\n            <sc-for list=\"{{ scanResult.macros }}\" as=\"m\" hint-placeholder-count=\"4\">\n              <div style=\"background: #FFFFFF; border: 1px solid #E9E1D5; border-radius: 12px; padding: 10px 8px; text-align: center;\">\n                <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 15px;\">{{ m.value }}<\u002Fdiv>\n                <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 8.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #8A8075; margin-top: 2px;\">{{ m.label }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background: #FFFFFF; border: 1px solid #E9E1D5; border-radius: 16px; padding: 15px; margin-bottom: 10px;\">\n            <div style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8075; margin-bottom: 11px;\">What it found<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n              <sc lay: block;\"><\u002Fspan>\n      <span style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;\">Plan<\u002Fspan>\n    <\u002Fbutton>\n    <button sc-camel-on-click=\"{{ goScan }}\" style=\"display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 2px 6px; min-height: 48px; justify-content: flex-end;\">\n      <span style=\"width: 46px; height: 46px; border-radius: 999px; background: {{ scanBtnBg }}; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(194, 84, 47, 0.32); margin-top: -14px;\">\n        <span style=\"width: 18px; height: 18px; border-radius: 999px; border: 2.5px solid #FFFFFF; display: block;\"><\u002Fspan>\n      <\u002Fspan>\n      <span style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: {{ navColors.scan }};\">Scan<\u002Fspan>\n    <\u002Fbutton>\n    <button sc-camel-on-click=\"{{ goLog }}\" style=\"display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 2px; min-height: 48px; justify-content: center; color: {{ navColors.log }};\">\n      <span style=\"width: 15px; height: 3px; border-top: 2px solid currentColor; border-bottom: 2px solid currentColor; height: 11px; display: block;\"><\u002Fspan>\n      <span style=\"font-family: 'DM Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;\">Log<\u002Fspan>\n    <\u002Fbutton>\n    <button sc-camel-on-click=\"{{ goSource }}\" style=\"display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 2px; min-height: 48px; justify-content: center; color: {{ navColors.source }};\">\n      <span style=\"width: 15px; height: 15px; display: block; border: 2px solid currentColor; transform: rotate(45deg); border-radius: 2px;\"><\u002Fspan>\n      <span style=\"font-family: 'DM Mono', ui-monospace, monospace; font-si
